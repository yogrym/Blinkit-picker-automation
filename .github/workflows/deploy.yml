name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  REMOTE_DIR: /picker_backend/jar
  APP_NAME: BlinkitPicker
  SERVICE_NAME: blinkit-picker

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build application
        run: ./mvnw -B clean package -DskipTests

      - name: Copy artifact to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: target/BlinkitPicker-*.jar
          target: /tmp/${{ env.APP_NAME }}-${{ github.sha }}
          strip_components: 1

      - name: Install and restart service
        uses: appleboy/ssh-action@v1
        env:
          RELEASE_DIR: /tmp/${{ env.APP_NAME }}-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: RELEASE_DIR,REMOTE_DIR,APP_NAME,SERVICE_NAME
          script: |
            set -eu
            JAR_PATH="$(find "$RELEASE_DIR" -maxdepth 1 -type f -name '*.jar' | head -n 1)"
            test -n "$JAR_PATH"
            
            # Ensure the target directory exists
            sudo mkdir -p "${REMOTE_DIR}"
            
            # Move the jar to the correct location and rename it
            sudo mv "$JAR_PATH" "${REMOTE_DIR}/${APP_NAME}.jar"
            
            # (Optional) Ensure proper ownership/permissions if needed, e.g., sudo chown root:root
            
            # Restart the service
            sudo systemctl daemon-reload
            sudo systemctl restart "${SERVICE_NAME}"
            sudo systemctl is-active --quiet "${SERVICE_NAME}"
            
            # Cleanup temp directory
            rm -rf "$RELEASE_DIR"
